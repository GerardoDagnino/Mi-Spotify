<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Spotify - modo simple</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Mi Spotify</h1>
    <nav>
      <a href="./">Ir al login</a>
    </nav>
  </header>

  <main class="embeds-page">
    <section class="hero">
      <div>
        <h2>Escucha sin iniciar sesión</h2>
        <p>Guarda playlists, álbumes, canciones o podcasts de Spotify y reprodúcelos aquí.</p>
      </div>
      <button id="theme-btn" class="ghost">Tema claro</button>
    </section>

    <section class="add-card">
      <label for="spotify-url">Enlace de Spotify</label>
      <div class="add-row">
        <input id="spotify-url" type="url" placeholder="https://open.spotify.com/playlist/..." />
        <button id="add-btn" class="primary">Agregar</button>
      </div>
      <p id="embed-error" class="error"></p>
      <p class="hint">El volumen se controla con el volumen del sistema: Spotify no lo permite en los reproductores incrustados.</p>
    </section>

    <div id="embeds" class="embed-grid"></div>
  </main>

  <script src="embeds.js?v=3"></script>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
